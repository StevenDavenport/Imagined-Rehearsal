agent:
  ac_grads: false
  advnorm: {impl: none, limit: 1e-08, rate: 0.01}
  conhead: {act: silu, layers: 1, norm: rms, output: binary, outscale: 1.0,
      units: 512, winit: trunc_normal_in}
  contdisc: true
  dec:
    simple:
      act: silu
      bspace: 8
      depth: 32
      kernel: 5
      layers: 3
      mults: [2, 3, 4, 4]
      norm: rms
      outer: false
      outscale: 1.0
      strided: false
      units: 512
      winit: trunc_normal_in
    typ: simple
  dyn:
    rssm: {absolute: false, act: silu, blocks: 8, classes: 32, deter: 4096,
        dynlayers: 1, free_nats: 1.0, hidden: 512, imglayers: 2, norm: rms,
        obslayers: 1, outscale: 1.0, stoch: 32, unimix: 0.01, winit:
        trunc_normal_in}
    typ: rssm
  enc:
    simple:
      act: silu
      depth: 32
      kernel: 5
      layers: 3
      mults: [2, 3, 4, 4]
      norm: rms
      outer: false
      strided: false
      symlog: true
      units: 512
      winit: trunc_normal_in
    typ: simple
  goal_conditioning:
    canonicalize_noop_position: false
    count: 5
    enabled: true
    exclude_keys: [goal_complete, is_physical_terminal]
    key: goal_id
  horizon: 333
  imag_last: 0
  imag_length: 15
  imag_loss: {actent: 0.0003, lam: 0.95, slowreg: 1.0, slowtar: false}
  loss_scales: {con: 1.0, dyn: 1.0, policy: 1.0, rec: 1.0, rep: 0.1, repval: 0.3,
    rew: 1.0, value: 1.0}
  model_lr: 4e-05
  opt: {agc: 0.3, anneal: 0, beta1: 0.9, beta2: 0.999, eps: 1e-20, lr: 4e-05,
      momentum: true, schedule: const, warmup: 1000, wd: 0.0}
  policy: {act: silu, layers: 3, maxstd: 1.0, minstd: 0.1, norm: rms, outscale:
      0.01, unimix: 0.01, units: 512, winit: trunc_normal_in}
  policy_dist_cont: bounded_normal
  policy_dist_disc: categorical
  repl_loss: {lam: 0.95, slowreg: 1.0, slowtar: false}
  report: false
  report_gradnorms: false
  repval_grad: true
  repval_loss: true
  retnorm: {debias: false, impl: perc, limit: 1.0, perchi: 95.0, perclo: 5.0,
      rate: 0.01}
  reward_grad: true
  rewhead: {act: silu, bins: 255, layers: 1, norm: rms, output: symexp_twohot,
      outscale: 0.0, units: 512, winit: trunc_normal_in}
  slowvalue: {every: 1, rate: 0.02}
  valnorm: {impl: none, limit: 1e-08, rate: 0.01}
  value: {act: silu, bins: 255, layers: 3, norm: rms, output: symexp_twohot,
      outscale: 0.0, units: 512, winit: trunc_normal_in}
batch_length: 32
batch_size: 8
cir:
  action_scale_a: 1.0
  action_scale_b: 0.7
  adapt_every: 25
  adapt_steps: 1
  anchor_stride: 25
  baseline_episodes: 3
  cir_episodes: 10
  divergence_factor: 10.0
  divergence_patience: 2
  episode_model_updates: 32
  eval_milestones: [1, 3, 5, 10]
  freeze_actor: false
  freeze_critic: false
  gamma: 0.997
  initial_model_updates: 128
  mild_ratio: 0.85
  model_checkpoint_interval: 32
  probe_batch: 8
  probe_horizons: [6, 12, 24, 48]
  reencode_chunk: 32
  severe_ratio: 0.15
  shock_episodes: 2
clock_addr: ''
clock_port: ''
consec_report: 1
consec_train: 1
