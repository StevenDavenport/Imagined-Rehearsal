defaults:

  logdir: ~/logdir/{timestamp}
  replica: 0
  replicas: 1
  method: name
  task: dummy_disc
  seed: 0
  script: train
  batch_size: 16
  batch_length: 64
  report_length: 32
  consec_train: 1
  consec_report: 1
  replay_context: 1
  random_agent: False
  clock_addr: ''
  clock_port: ''
  ipv6: False
  errfile: False

  logger:
    outputs: [jsonl, scope]
    filter: 'score|length|fps|ratio|train/loss/|train/rand/'
    timer: True
    fps: 15
    user: ''

  env:
    atari: {size: [96, 96], repeat: 4, sticky: True, gray: True, actions: all, lives: unused, noops: 30, autostart: False, pooling: 2, aggregate: max, resize: pillow, clip_reward: False}
    procgen: {size: [96, 96], resize: pillow}
    crafter: {size: [64, 64], logs: False}
    atari100k: {size: [64, 64], repeat: 4, sticky: False, gray: False, actions: needed, lives: unused, noops: 30, autostart: False, resize: pillow, clip_reward: False}
    dmlab: {size: [64, 64], repeat: 4, episodic: True, use_seed: True}
    minecraft: {size: [64, 64], break_speed: 100.0, logs: False, length: 36000}
    dmc: {size: [64, 64], repeat: 1, proprio: True, image: True, camera: -1, action_scale: 1.0}
    loconav: {size: [64, 64], repeat: 1, camera: -1}
    rlscape:
      use_seed: True
      goals: [kill_goblin, bury_bones, chop_logs, light_fire, catch_fish]
      goal_schedule: round_robin
      package_version: '0.1.6'
      launch: True
      server_dir: ''
      server_runtime_dir: ''
      client_dir: ''
      java_home: ''
      mvn_path: ''
      username: agent
      resize: [240, 160]
      render_mode: rgb_array
      camera_mode: birdseye
      resize_filter: area
      action_interface: mixed
      grid_columns: 28
      grid_rows: 18
      episode_length: 200
      reward_mode: sparse_success
      server_barrier: True
      sync_to_tick: True
      tick_divisor: 1
      auto_calibrate_tick: True
      reset_kind: task
      audit_path: ''

  replay:
    kind: fifo
    size: 5e6
    groups: 1
    group_key: goal_id
    retention: fifo
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    prio: {exponent: 0.8, maxfrac: 0.5, initial: inf, zero_on_sample: True}
    priosignal: model
    recexp: 1.0
    chunksize: 1024
    save_wait: False

  run:
    steps: 1e10
    duration: 0
    train_ratio: 32.0
    log_every: 120
    report_every: 300
    save_every: 900
    ckpt_keep: 1
    envs: 16
    eval_envs: 4
    eval_eps: 1
    eval_episodes: 0
    eval_warmup_episodes: 0
    eval_policy_mode: deterministic
    milestone_every: 0
    milestone_dir: ''
    milestone_goal: ''
    milestone_phase: -1
    milestone_spec_digest: ''
    report_batches: 1
    from_checkpoint: ''
    from_checkpoint_regex: ''
    episode_timeout: 180
    actor_addr: 'localhost:{auto}'
    replay_addr: 'localhost:{auto}'
    logger_addr: 'localhost:{auto}'
    actor_batch: -1
    actor_threads: 1
    agent_process: False
    remote_replay: False
    remote_envs: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    debug: True

  jax:
    platform: cuda
    compute_dtype: bfloat16
    policy_devices: [0]
    train_devices: [0]
    mock_devices: 0
    prealloc: True
    jit: True
    debug: False
    expect_devices: 0
    enable_policy: True
    precompile: True
    coordinator_address: ''

  agent:
    loss_scales: {rec: 1.0, rew: 1.0, con: 1.0, dyn: 1.0, rep: 0.1, policy: 1.0, value: 1.0, repval: 0.3}
    goal_conditioning:
      enabled: False
      key: goal_id
      count: 0
      exclude_keys: [goal_complete, is_physical_terminal]
      canonicalize_noop_position: False
    opt: {lr: 4e-5, agc: 0.3, eps: 1e-20, beta1: 0.9, beta2: 0.999, momentum: True, wd: 0.0, schedule: const, warmup: 1000, anneal: 0}
    model_lr: 4e-5
    ac_grads: False
    dyn:
      typ: rssm
      rssm: {deter: 8192, hidden: 1024, stoch: 32, classes: 64, act: silu, norm: rms, unimix: 0.01, outscale: 1.0, winit: trunc_normal_in, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, blocks: 8, free_nats: 1.0}
    enc:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, winit: trunc_normal_in, symlog: True, outer: False, kernel: 5, strided: False}
    dec:
      typ: simple
      simple: {depth: 64, mults: [2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, outscale: 1.0, winit: trunc_normal_in, outer: False, kernel: 5, bspace: 8, strided: False}
    rewhead: {layers: 1, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    conhead: {layers: 1, units: 1024, act: silu, norm: rms, output: binary, outscale: 1.0, winit: trunc_normal_in}
    policy: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01, unimix: 0.01, winit: trunc_normal_in}
    value: {layers: 3, units: 1024, act: silu, norm: rms, output: symexp_twohot, outscale: 0.0, winit: trunc_normal_in, bins: 255}
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 15
    horizon: 333
    contdisc: True
    imag_loss: {slowtar: False, lam: 0.95, actent: 3e-4, slowreg: 1.0}
    repl_loss: {slowtar: False, lam: 0.95, slowreg: 1.0}
    slowvalue: {rate: 0.02, every: 1}
    retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0, debias: False}
    valnorm: {impl: none, rate: 0.01, limit: 1e-8}
    advnorm: {impl: none, rate: 0.01, limit: 1e-8}
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False

  eval_adapt:
    enabled: False
    persistence: episode
    output_checkpoint: ''
    resume_adapt_state: False
    train_critic: False
    objective: standard
    reference_checkpoint: ''
    mix_beta: 0.0
    value_correction_clip: 0.0
    update_rms_clip: 0.0
    paired_rng: False
    paired_rng_seed: 0
    paired_rng_stride: 1000
    steps: 3
    imag_length: 10
    lr: 1e-4
    critic_lr: 1e-4
    every_k: 0
    actent: 3e-4
    start_batch: 1
    trace:
      enabled: False
      filename: trace.jsonl
    gate:
      enabled: False
      kind: none
      audit: False
      entropy_threshold: 1.0
      js_threshold: 1.0
      min_success_rate: 0.03125
      direction_threshold: 1.0
      reward_threshold: 0.5
    viewer:
      enabled: False
      traj_index: 0

  cir:
    action_scale_a: 1.0
    action_scale_b: 0.7
    baseline_episodes: 3
    shock_episodes: 2
    initial_model_updates: 128
    model_checkpoint_interval: 32
    cir_episodes: 10
    episode_model_updates: 32
    adapt_every: 25
    adapt_steps: 1
    eval_milestones: [1, 3, 5, 10]
    probe_horizons: [6, 12, 24, 48]
    anchor_stride: 25
    probe_batch: 8
    reencode_chunk: 32
    gamma: 0.997
    mild_ratio: 0.85
    severe_ratio: 0.15
    divergence_factor: 10.0
    divergence_patience: 2
    freeze_actor: False
    freeze_critic: False

  head_audit:
    selection: ''
    goal_names: [kill_goblin, bury_bones, chop_logs, light_fire, catch_fish]
    chunk_length: 32
    horizon: 333

  imagination_audit:
    selection: ''
    goal_names: [kill_goblin, bury_bones, chop_logs, light_fire, catch_fish]
    chunk_length: 32
    horizon: 6
    particles: 128
    anchors_per_episode: 4
    seed_base: 20260810

  critic_provenance:
    selection: ''
    goal_names: [kill_goblin, bury_bones, chop_logs, light_fire, catch_fish]
    chunk_length: 32
    horizons: [1, 3, 6, 15, 20]
    posterior_samples: 128
    anchors_per_episode: 4
    seed_base: 20260813

  head_repair:
    enabled: False
    selection: ''
    cache: ''
    output_checkpoint: ''
    condition: factual_only
    chunk_length: 32
    states_per_episode: 24
    head_updates: 2000
    value_updates: 2000
    batch_size: 256
    event_fraction: 0.5
    learning_rate: 4e-5
    seed: 20260816

  agent.bounded_value:
    enabled: False
    layers: 3
    units: 1024
    act: silu
    norm: rms
    output: binary
    outscale: 0.0
    winit: trunc_normal_in

size1m: &size1m
  .*\.rssm: {deter: 512, hidden: 64, classes: 4}
  .*\.depth: 4
  .*\.units: 64

size12m: &size12m
  .*\.rssm: {deter: 2048, hidden: 256, classes: 16}
  .*\.depth: 16
  .*\.units: 256

size25m: &size25m
  .*\.rssm: {deter: 3072, hidden: 384, classes: 24}
  .*\.depth: 24
  .*\.units: 384

size50m: &size50m
  .*\.rssm: {deter: 4096, hidden: 512, classes: 32}
  .*\.depth: 32
  .*\.units: 512

size100m: &size100m
  .*\.rssm: {deter: 6144, hidden: 768, classes: 48}
  .*\.depth: 48
  .*\.units: 768

size200m: &size200m
  .*\.rssm: {deter: 8192, hidden: 1024, classes: 64}
  .*\.depth: 64
  .*\.units: 1024

size400m: &size400m
  .*\.rssm: {deter: 12288, hidden: 1536, classes: 96}
  .*\.depth: 96
  .*\.units: 1536

minecraft:
  task: minecraft_diamond

dmlab:
  task: dmlab_explore_goal_locations_small
  run: {steps: 2.6e7, train_ratio: 32}

atari:
  task: atari_pong
  run: {steps: 5.1e7, train_ratio: 32}

procgen:
  task: procgen_coinrun
  run: {steps: 1.1e8, train_ratio: 64}

atari100k:
  task: atari100k_pong
  run: {steps: 1.1e5, envs: 1, train_ratio: 256}

crafter:
  task: crafter_reward
  run: {steps: 1.1e6, envs: 1, train_ratio: 512}

dmc_proprio:
  <<: *size1m
  task: dmc_walker_walk
  env.dmc.image: False
  run: {steps: 1.1e6, train_ratio: 1024}

dmc_vision:
  task: dmc_walker_walk
  env.dmc.proprio: False
  run: {steps: 1.1e6, train_ratio: 256}

rlscape:
  <<: *size1m
  task: rlscape_multigoal
  batch_size: 4
  batch_length: 16
  report_length: 16
  replay_context: 0
  replay.size: 2000
  replay.online: False
  run: {envs: 1, debug: True, train_ratio: 8}
  agent:
    goal_conditioning:
      enabled: True
      key: goal_id
      count: 5
      canonicalize_noop_position: True

rlscape_click_grid:
  env.rlscape.action_interface: click_grid
  env.rlscape.grid_columns: 28
  env.rlscape.grid_rows: 18
  agent.goal_conditioning.canonicalize_noop_position: False

rlscape_smoke:
  env.rlscape.episode_length: 32
  batch_size: 4
  batch_length: 16
  report_length: 16
  replay.size: 2000
  run: {steps: 220, envs: 1, train_ratio: 4, log_every: 30, report_every: 1000000, save_every: 1000000, debug: True}
  jax: {platform: cpu, compute_dtype: float32, prealloc: False, precompile: False}
  agent.report: False

rlscape_m1_pilot:
  env.rlscape.episode_length: 200
  batch_size: 4
  batch_length: 16
  report_length: 16
  replay.size: 10000
  replay.online: False
  run: {steps: 1000, envs: 1, train_ratio: 4, log_every: 30, report_every: 1000000, save_every: 60, ckpt_keep: 2, debug: True}
  jax: {platform: cpu, compute_dtype: float32, prealloc: False, precompile: False}
  agent.report: False

rlscape_m1_learnability:
  <<: *size50m
  env.rlscape.episode_length: 200
  batch_size: 8
  batch_length: 32
  report_length: 32
  replay.size: 200000
  replay.online: False
  run: {steps: 200000, envs: 1, train_ratio: 32, log_every: 300, report_every: 1000000, save_every: 1800, ckpt_keep: 3, debug: True}
  jax: {platform: cuda, compute_dtype: bfloat16, prealloc: True, precompile: True}
  agent.report: False

rlscape_m2_multitask:
  <<: *size50m
  env.rlscape.goal_schedule: random
  env.rlscape.episode_length: 200
  batch_size: 8
  batch_length: 32
  report_length: 32
  replay.size: 350000
  replay.online: False
  run: {steps: 2000000, envs: 1, train_ratio: 32, log_every: 300, report_every: 1000000, save_every: 1800, ckpt_keep: 3, debug: True}
  jax: {platform: cuda, compute_dtype: bfloat16, prealloc: True, precompile: True}
  agent.report: False

rlscape_m2_eval:
  <<: *size50m
  script: eval_only
  env.rlscape.episode_length: 200
  batch_size: 8
  batch_length: 32
  report_length: 32
  run: {envs: 1, eval_episodes: 20, log_every: 300, debug: True}
  jax: {platform: cuda, compute_dtype: bfloat16, prealloc: True, precompile: True}
  eval_adapt.enabled: False
  agent.report: False

rlscape_m3_sequential:
  <<: *size50m
  env.rlscape.episode_length: 200
  batch_size: 8
  batch_length: 32
  report_length: 32
  replay.size: 200000
  replay.online: False
  replay.save_wait: True
  logger.filter: 'score|length|fps|ratio|train/loss/|train/rand/|replay/(items|episodes|ram_gb|episodes_seen|admitted|replaced|rejected|abandoned|active_goals|goal_)'
  run: {steps: 500000, envs: 1, train_ratio: 32, log_every: 300, report_every: 1000000, save_every: 1800, ckpt_keep: 3, debug: True, milestone_every: 250000}
  jax: {platform: cuda, compute_dtype: bfloat16, prealloc: True, precompile: True}
  agent.report: False

rlscape_m3_episode_reservoir:
  replay.kind: episode_reservoir
  replay.retention: reservoir
  replay.online: False

rlscape_m3_eval:
  <<: *size50m
  script: eval_only
  env.rlscape.episode_length: 200
  batch_size: 8
  batch_length: 32
  report_length: 32
  run: {envs: 1, eval_episodes: 100, eval_policy_mode: sampled, log_every: 300, debug: True}
  jax: {platform: cuda, compute_dtype: bfloat16, prealloc: True, precompile: True}
  eval_adapt.enabled: False
  agent.report: False

rlscape_m3_actor_ir:
  eval_adapt: {enabled: True, train_critic: False, steps: 1, imag_length: 6, lr: 4e-5, critic_lr: 4e-5, every_k: 1, actent: 3e-4, start_batch: 128}

rlscape_m3_head_audit:
  <<: *size50m
  script: head_audit
  env.rlscape.episode_length: 200
  batch_size: 8
  batch_length: 32
  report_length: 32
  replay_context: 0
  jax: {platform: cuda, compute_dtype: bfloat16, prealloc: True, precompile: False}
  agent.report: False
  eval_adapt.enabled: False

rlscape_m3_imagination_audit:
  <<: *size50m
  script: imagination_audit
  env.rlscape.episode_length: 200
  batch_size: 8
  batch_length: 32
  report_length: 32
  replay_context: 0
  jax: {platform: cuda, compute_dtype: bfloat16, prealloc: True, precompile: False}
  agent.report: False
  eval_adapt.enabled: False
  eval_adapt.actent: 3e-4

rlscape_stage3a_critic_provenance:
  <<: *size50m
  script: critic_provenance
  env.rlscape.episode_length: 200
  batch_size: 8
  batch_length: 32
  report_length: 32
  replay_context: 0
  jax: {platform: cuda, compute_dtype: bfloat16, prealloc: True, precompile: False}
  agent.report: False
  eval_adapt.enabled: False
  eval_adapt.actent: 3e-4

rlscape_stage4a_head_repair:
  <<: *size50m
  script: head_repair
  env.rlscape.episode_length: 200
  batch_size: 8
  batch_length: 32
  report_length: 32
  replay_context: 0
  jax: {platform: cuda, compute_dtype: bfloat16, prealloc: True, precompile: False}
  agent.report: False
  agent.bounded_value.enabled: True
  head_repair.enabled: True
  eval_adapt.enabled: False

rlscape_stage4a_bounded_value:
  <<: *size50m
  env.rlscape.episode_length: 200
  batch_size: 8
  batch_length: 32
  report_length: 32
  replay_context: 0
  jax: {platform: cuda, compute_dtype: bfloat16, prealloc: True, precompile: False}
  agent.report: False
  agent.bounded_value.enabled: True

rlscape_kill_goblin:
  task: rlscape_kill_goblin
  env.rlscape.goals: [kill_goblin]
  env.rlscape.goal_schedule: fixed

rlscape_bury_bones:
  task: rlscape_bury_bones
  env.rlscape.goals: [bury_bones]
  env.rlscape.goal_schedule: fixed

rlscape_chop_logs:
  task: rlscape_chop_logs
  env.rlscape.goals: [chop_logs]
  env.rlscape.goal_schedule: fixed

rlscape_light_fire:
  task: rlscape_light_fire
  env.rlscape.goals: [light_fire]
  env.rlscape.goal_schedule: fixed

rlscape_catch_fish:
  task: rlscape_catch_fish
  env.rlscape.goals: [catch_fish]
  env.rlscape.goal_schedule: fixed

cir_cheetah:
  script: cir
  task: dmc_cheetah_run
  batch_size: 8
  batch_length: 32
  replay_context: 0
  replay.size: 100000
  replay.online: False
  run: {envs: 1, debug: True, ckpt_keep: 2}
  jax.precompile: False
  agent.model_lr: 4e-5
  cir.freeze_critic: True
  eval_adapt: {enabled: True, train_critic: False, steps: 1, imag_length: 12, lr: 1e-4, critic_lr: 1e-4, every_k: 25, actent: 3e-4, start_batch: 128}

cir_cheetah_critic_first:
  cir.freeze_critic: False
  eval_adapt.train_critic: True

cir_cheetah_wm_only:
  cir.freeze_actor: True
  cir.freeze_critic: True
  eval_adapt.train_critic: False

bsuite:
  task: bsuite_mnist/0
  run: {envs: 1, save_every: -1, train_ratio: 1024}

loconav:
  task: loconav_ant_maze_m
  env.loconav.repeat: 1
  run.train_ratio: 256

multicpu:
  batch_size: 12
  jax.mock_devices: 8
  jax.policy_devices: [0, 1]
  jax.train_devices: [2, 3, 4, 5, 6, 7]

debug:
  batch_size: 8
  batch_length: 10
  report_length: 5
  jax: {platform: cpu, debug: True, prealloc: False}
  run: {envs: 4, report_every: 10, log_every: 5, save_every: 15, train_ratio: 8, debug: True}
  replay.size: 1e4
  agent:
    .*\.bins: 5
    .*\.layers: 1
    .*\.units: 8
    .*\.stoch: 2
    .*\.classes: 4
    .*\.deter: 8
    .*\.hidden: 3
    .*\.blocks: 4
    .*\.depth: 2
